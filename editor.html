<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pro Level Editor - Slide Master</title>
<style>
:root {
  --bg: #121212; --surface: #1e1e1e; --surface-light: #2a2a2a;
  --text: #e0e0e0; --text-muted: #888;
  --red: #FF3B42; --blue: #00B4FF; --yel: #FFCC00; --grn: #00E676;
  --primary: #4CAF50; --danger: #f44336; --info: #2196F3;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; font-family: system-ui, -apple-system, sans-serif; }
body { margin: 0; padding: 15px; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

/* Header */
.header { width: 100%; max-width: 340px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 8px; }
.header h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 1px; color: var(--text); }
.header .stats { font-size: 11px; color: var(--text-muted); background: var(--surface); padding: 6px 10px; border-radius: 6px; }
.header .back-btn { font-size: 11px; color: var(--text-muted); text-decoration: none; padding: 6px 10px; background: var(--surface); border-radius: 6px; }

/* Papan Grid */
#board-wrapper { width: 100%; max-width: 340px; padding: 10px; background: var(--surface); border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); margin-bottom: 20px; }
#grid { 
  --pad: 8px;
  --gap: 4px;
  --cell-w: calc((100% - (2 * var(--pad)) - (3 * var(--gap))) / 4);
  --cell-h: calc((100% - (2 * var(--pad)) - (4 * var(--gap))) / 5);
  display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); 
  background: #0a0a0a; padding: var(--pad); border-radius: 12px; 
  width: 100%; aspect-ratio: 4/5; position: relative;
  border: 1px solid #333; box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
}
.cell { background: rgba(255,255,255,0.05); border-radius: 6px; cursor: pointer; }
.piece { 
  position: absolute; border-radius: 6px; pointer-events: none; 
  box-shadow: inset 0 3px 5px rgba(255,255,255,0.3), inset 0 -3px 5px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); animation: pop-in 0.2s ease-out;
}
@keyframes pop-in { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.t_r { background: var(--red); color: rgba(0,0,0,0.2); }
.t_v { background: var(--blue); color: rgba(0,0,0,0.2); }
.t_h { background: var(--grn); color: rgba(0,0,0,0.2); }
.t_y { background: var(--yel); color: rgba(0,0,0,0.2); }

/* Toolbar */
.toolbar { width: 100%; max-width: 340px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px; }
.tool-btn { 
  width: 58px; height: 58px; border-radius: 12px; border: 2px solid transparent; 
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 10px; color: #000;
  box-shadow: 0 4px 0 rgba(0,0,0,0.6); cursor: pointer; transition: all 0.1s; line-height: 1.2; text-align: center;
}
.tool-btn.active { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.5), 0 2px 0 rgba(0,0,0,0.6); transform: translateY(2px); }
.tool-btn[data-type="r"] { background: var(--red); width: 72px; }
.tool-btn[data-type="v"] { background: var(--blue); }
.tool-btn[data-type="h"] { background: var(--grn); width: 72px; }
.tool-btn[data-type="y"] { background: var(--yel); }
.tool-btn[data-type="x"] { background: var(--surface-light); color: #fff; border-color: #444; }

/* Controls */
.controls { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; width: 100%; }
button { flex: 1; padding: 14px 10px; border: none; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
button:active { opacity: 0.8; transform: scale(0.98); }
button:disabled { opacity: 0.4; pointer-events: none; }
.btn-primary { background: var(--primary); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-info { background: var(--info); color: white; }
.btn-dark { background: var(--surface-light); color: white; border: 1px solid #444; }
.btn-ai { background: linear-gradient(135deg, #a855f7, #6366f1); color: white; }
.btn-solve { background: linear-gradient(135deg, #f59e0b, #f97316); color: #1a1a1a; font-weight: 900; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 100; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
.modal-content { width: 100%; max-width: 340px; background: var(--surface); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
.modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
.modal-header h2 { margin: 0; font-size: 16px; }
.close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 24px; padding: 0; box-shadow: none; width: auto; cursor: pointer; }

.level-list { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; padding-right: 5px; }
.level-item { background: var(--surface-light); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid #333; }
.mini-grid { width: 50px; height: 62.5px; background: #0a0a0a; border-radius: 6px; position: relative; flex-shrink: 0; border: 1px solid #444; }
.mini-piece { position: absolute; border-radius: 2px; }
.level-info { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.level-title { font-weight: bold; font-size: 14px; }
.level-actions { display: flex; gap: 5px; }
.action-btn { padding: 6px 10px; font-size: 12px; border-radius: 6px; box-shadow: none; flex: initial; }

/* Form fields */
.fld { display: flex; flex-direction: column; gap: 5px; }
.fld label { font-size: 12px; color: var(--text-muted); }
.fld input, .fld select, .fld textarea { padding: 10px; border-radius: 8px; background: var(--surface-light); color: var(--text); border: 1px solid #444; font-size: 13px; font-family: inherit; }
.fld input:focus, .fld select:focus { outline: 1px solid var(--info); }

/* Toast */
#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #333; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 200; box-shadow: 0 5px 15px rgba(0,0,0,0.5); max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { background: var(--danger); }
#toast.success { background: var(--primary); }
#toast.info { background: var(--info); }

/* Animasi Solve Moves */
#animBar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; padding: 10px 16px; border-radius: 30px; box-shadow: 0 6px 24px rgba(0,0,0,0.7), 0 0 0 2px rgba(255,255,255,0.1); z-index: 150; display: none; align-items: center; gap: 10px; color: #fff; font-size: 13px; font-weight: 800; white-space: nowrap; }
#animBar.active { display: flex; }
#animBar button { flex: initial; padding: 8px 14px; font-size: 12px; font-weight: 700; border-radius: 20px; box-shadow: none; }
#animPause { background: #444; color: #fff; }
#animStop { background: #c62828; color: #fff; }
#grid.anim-mode .piece { transition: left 0.32s cubic-bezier(.4,.2,.3,1), top 0.32s cubic-bezier(.4,.2,.3,1); }
.piece.anim-moving { outline: 3px solid #fff; outline-offset: -3px; z-index: 10; filter: brightness(1.25); }
.piece.anim-win { outline: 3px solid #00E676; outline-offset: -3px; box-shadow: 0 0 0 3px rgba(0,230,118,0.5), 0 0 30px rgba(0,230,118,0.9); z-index: 10; }
</style>
</head>
<body>

<!-- Modal AI -->

<div class="modal-overlay" id="movesModal">

    <div id="movesSummary" style="font-size:12px;color:var(--text-muted);text-align:center;padding:8px;background:var(--surface-light);border-radius:8px;"></div>

</div>

<div id="animBar">
  <span id="animLabel">▶ 0/0</span>
  <button id="animPause">⏸ Pause</button>
  <button id="animStop">✕ Stop</button>
</div>

<div id="toast">Pesan</div>

<script>
// === KONFIGURASI ===
const DIM = { r:[2,2], v:[1,2], h:[2,1], y:[1,1] };
const TOTAL_CELLS = 20;
const MAX_CELLS = 18; // 2 cell harus kosong
const AI_CONFIG_KEY = 'slide_master_ai_config';

// === STATE ===
let currentTool = 'r';
let placedPieces = [];
let savedLevels = [];
let editIndex = -1;
let history = [];
let redoStack = [];

let aiConfig = { provider: 'openai', model: 'gpt-4o-mini', apiKey: '', baseURL: '' };

// === AI CONFIG ===
function loadAIConfig() {
  try {
    const c = JSON.parse(localStorage.getItem(AI_CONFIG_KEY) || '{}');
    aiConfig = Object.assign({ provider: 'openai', model: 'gpt-4o-mini', apiKey: '', baseURL: '' }, c);
  } catch(_) {}
}
function saveAIConfigStore() {
  try { localStorage.setItem(AI_CONFIG_KEY, JSON.stringify(aiConfig)); } catch(_) {}
}
function readAIForm() {
  return {
    provider: document.getElementById('aiProvider').value,
    model: document.getElementById('aiModel').value.trim(),
    apiKey: document.getElementById('aiApiKey').value.trim(),
    baseURL: document.getElementById('aiBaseUrl').value.trim()
  };
}

// === UTIL ===
function cellsOf(pieces) {
  return pieces.reduce((sum, p) => {
    const d = Array.isArray(p) ? DIM[p[0]] : DIM[p.t];
    return sum + d[0] * d[1];
  }, 0);
}

// === VALIDASI PUZZLE ===
function validatePuzzle(pieces, strict18) {
  if (!Array.isArray(pieces) || pieces.length === 0) return { ok: false, err: 'Puzzle kosong' };
  
  let totalCells = 0, redCount = 0, redPos = null;
  const grid = Array(20).fill(-1);
  
  for (let i = 0; i < pieces.length; i++) {
    const p = pieces[i];
    if (!Array.isArray(p) || p.length !== 3) return { ok: false, err: 'Format piece #' + (i+1) + ' salah' };
    const t = p[0];
    if (!DIM[t]) return { ok: false, err: 'Tipe tidak dikenal: ' + t };
    const [w, h] = DIM[t];
    const x = p[1], y = p[2];
    if (typeof x !== 'number' || typeof y !== 'number') return { ok: false, err: 'Koordinat bukan angka' };
    if (x < 0 || y < 0 || x + w > 4 || y + h > 5) return { ok: false, err: 'Keluar batas: ' + t + ' (' + x + ',' + y + ')' };
    for (let dx = 0; dx < w; dx++) for (let dy = 0; dy < h; dy++) {
      const idx = (y + dy) * 4 + (x + dx);
      if (grid[idx] !== -1) return { ok: false, err: 'Overlap di (' + (x+dx) + ',' + (y+dy) + ')' };
      grid[idx] = i;
    }
    totalCells += w * h;
    if (t === 'r') { redCount++; redPos = [x, y]; }
  }
  
  if (redCount !== 1) return { ok: false, err: 'Harus tepat 1 merah (ada ' + redCount + ')' };
  if (strict18) {
    if (totalCells !== MAX_CELLS) return { ok: false, err: 'Harus tepat ' + MAX_CELLS + ' cell (ada ' + totalCells + ')' };
  } else {
    if (totalCells > MAX_CELLS) return { ok: false, err: 'Melebihi ' + MAX_CELLS + ' cell (' + totalCells + ')' };
  }
  if (redPos[0] === 1 && redPos[1] === 3) return { ok: false, err: 'Merah sudah di target' };
  return { ok: true, totalCells };
}

// === BFS SOLVER ===
let solvePuzzleTimedOut = false;
function solvePuzzle(pieces, maxIter, maxMs) {
  solvePuzzleTimedOut = false;
  maxIter = maxIter || 3000000;
  maxMs = maxMs || 10000;
  const _solveT0 = performance.now();
  const key = s => {
    const g = Array(20).fill('.');
    s.forEach(([t,x,y]) => {
      const [w,h] = DIM[t];
      for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) g[(y+j)*4 + x+i] = t;
    });
    return g.join('');
  };
  const seen = new Set([key(pieces)]);
  const q = [{ s: pieces, p: -1, m: null }];
  const dirs = [[0,-1], [0,1], [-1,0], [1,0]];
  
  for (let h = 0; h < q.length && h < maxIter; h++) {
    if ((h & 1023) === 0 && performance.now() - _solveT0 > maxMs) {
      solvePuzzleTimedOut = true;
      return null;
    }
    const s = q[h].s;
    const ri = s.findIndex(p => p[0] === 'r');
    if (ri >= 0 && s[ri][1] === 1 && s[ri][2] === 3) {
      const mv = [];
      for (let i = h; q[i].p >= 0; i = q[i].p) mv.push(q[i].m);
      return mv.reverse();
    }
    const o = Array(20).fill(-1);
    s.forEach(([t,x,y], id) => {
      const [w,hh] = DIM[t];
      for (let i = 0; i < w; i++) for (let j = 0; j < hh; j++) o[(y+j)*4 + x+i] = id;
    });
    s.forEach(([t,x,y], id) => {
      const [w,hh] = DIM[t];
      dirs.forEach(([dx,dy]) => {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx+w > 4 || ny+hh > 5) return;
        for (let i = 0; i < w; i++) for (let j = 0; j < hh; j++) {
          const v = o[(ny+j)*4 + nx+i];
          if (v !== -1 && v !== id) return;
        }
        const ns = s.slice();
        ns[id] = [t, nx, ny];
        const k = key(ns);
        if (!seen.has(k)) {
          seen.add(k);
          q.push({ s: ns, p: h, m: [id, dx, dy] });
        }
      });
    });
  }
  return null;
}

// === INIT ===
async function init() {
  loadAIConfig();

  const stored = localStorage.getItem('slide_master_levels');
  if (stored) {
    try { savedLevels = JSON.parse(stored); } catch(e) {}
  }
  if (savedLevels.length === 0) {
    try {
      const res = await fetch('level.json', { cache: 'no-cache' });
      if (res.ok) {
        savedLevels = await res.json();
        localStorage.setItem('slide_master_levels', JSON.stringify(savedLevels));
        console.log('Loaded ' + savedLevels.length + ' level dari level.json');
      }
    } catch(e) {
      console.warn('Gagal load level.json', e);
    }
  }

  const gridEl = document.getElementById('grid');
  gridEl.innerHTML = '';
  for (let y = 0; y < 5; y++) {
    for (let x = 0; x < 4; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.x = x;
      cell.dataset.y = y;
      cell.addEventListener('pointerdown', handlePlace);
      gridEl.appendChild(cell);
    }
  }

  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTool = btn.dataset.type;
    });
  });

  updateUI();
}

// === PLACE ===
function handlePlace(e) {
  const x = parseInt(e.target.dataset.x);
  const y = parseInt(e.target.dataset.y);
  if (isNaN(x) || isNaN(y)) return;

  if (currentTool === 'x') {
    const idx = placedPieces.findIndex(p => x >= p.x && x < p.x + DIM[p.t][0] && y >= p.y && y < p.y + DIM[p.t][1]);
    if (idx !== -1) {
      saveHistory();
      placedPieces.splice(idx, 1);
      renderBoard();
    }
    return;
  }

  const w = DIM[currentTool][0], h = DIM[currentTool][1];
  if (x + w > 4 || y + h > 5) { showToast("Kotak keluar batas!", "error"); return; }

  const isOverlap = placedPieces.some(p => {
    const pw = DIM[p.t][0], ph = DIM[p.t][1];
    return (x < p.x + pw && x + w > p.x && y < p.y + ph && y + h > p.y);
  });
  if (isOverlap) { showToast("Bentrok dengan kotak lain!", "error"); return; }

  // Cek limit cell
  const addCells = w * h;
  const newTotal = cellsOf(placedPieces) + addCells;
  if (newTotal > MAX_CELLS) {
    showToast("Melebihi " + MAX_CELLS + " cell! Sisakan 2 cell kosong.", "error");
    return;
  }

  saveHistory();
  placedPieces.push({ t: currentTool, x, y });
  renderBoard();
}

// === RENDER ===
function renderBoard() {
  document.querySelectorAll('.piece').forEach(el => el.remove());
  placedPieces.forEach((p, idx) => {
    const div = document.createElement('div');
    div.className = 'piece t_' + p.t;
    div.dataset.idx = idx;
    const w = DIM[p.t][0], h = DIM[p.t][1];
    div.style.width = `calc(${w} * var(--cell-w) + ${w - 1} * var(--gap))`;
    div.style.height = `calc(${h} * var(--cell-h) + ${h - 1} * var(--gap))`;
    div.style.left = `calc(var(--pad) + ${p.x} * (var(--cell-w) + var(--gap)))`;
    div.style.top = `calc(var(--pad) + ${p.y} * (var(--cell-h) + var(--gap)))`;
    if (p.t === 'r') div.textContent = '▲';
    if (p.t === 'v') div.textContent = '⏺';
    if (p.t === 'h') div.textContent = '⬛';
    if (p.t === 'y') div.textContent = '●';
    document.getElementById('grid').appendChild(div);
  });
  updateUI();
}

// === FORMATTER JSON ===
function formatCleanJSON(levels) {
  let out = "[\n";
  levels.forEach((lvl, i) => {
    out += "  [\n    ";
    out += lvl.map(p => `["${p[0]}", ${p[1]}, ${p[2]}]`).join(", ");
    out += "\n  ]";
    if (i < levels.length - 1) out += ",";
    out += "\n";
  });
  out += "]";
  return out;
}

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "level.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

    showToast("File didownload & JSON dicopy!", "success");

function levelDifficulty(levelNum) {
  let tier, minM, maxM;
  if (levelNum <= 10)       { tier = 'VERY EASY';   minM = 3;  maxM = 6;  }
  else if (levelNum <= 30)  { tier = 'EASY';        minM = 5;  maxM = 10; }
  else if (levelNum <= 49)  { tier = 'MEDIUM';      minM = 8;  maxM = 15; }
  else if (levelNum <= 100) { tier = 'ADVANCED';    minM = 30; maxM = 40; }
  else if (levelNum <= 200) { tier = 'MASTER';      minM = 50; maxM = 60; }
  else if (levelNum <= 300) { tier = 'GRANDMASTER'; minM = 70; maxM = 80; }
  else if (levelNum <= 500) { tier = 'LEGENDARY';   minM = 90; maxM = 100; }
  else                      { tier = 'MYTHIC';      minM = 90; maxM = 100; }
  return tier + ' (' + minM + '-' + maxM + ' moves)';
}

function showSolveMoves(moves, arr) {
  const state = arr.map(p => [...p]);
  let html = '';
  moves.forEach(([id, dx, dy], i) => {
    const t = state[id][0];
    const fromX = state[id][1], fromY = state[id][2];
    state[id][1] += dx;
    state[id][2] += dy;
    const toX = state[id][1], toY = state[id][2];
    const color = t === 'r' ? 'var(--red)' : t === 'v' ? 'var(--blue)' : t === 'h' ? 'var(--grn)' : 'var(--yel)';
    const name = t === 'r' ? 'Merah 2x2' : t === 'v' ? 'Biru 1x2' : t === 'h' ? 'Hijau 2x1' : 'Kuning 1x1';
    const arrow = dx === 1 ? '→' : dx === -1 ? '←' : dy === 1 ? '↓' : '↑';
    html += `<div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface-light);border-radius:8px;margin-bottom:6px;border-left:4px solid ${color};">
      <div style="font-weight:800;color:var(--text-muted);min-width:24px;font-size:14px;">${i+1}.</div>
      <div style="flex:1;">
        <div style="font-weight:700;font-size:13px;">${name} <span style="color:${color};font-size:16px;">${arrow}</span></div>
        <div style="font-size:11px;color:var(--text-muted);">(${fromX},${fromY}) → (${toX},${toY})</div>
      </div>
    </div>`;
  });
  document.getElementById('movesList').innerHTML = html;
  document.getElementById('movesSummary').textContent = moves.length + ' langkah optimal';
  document.getElementById('movesModal').style.display = 'flex';
}

let animState = null;

function stopAnim() {
  if (!animState) return;
  clearTimeout(animState.timer);
  const original = animState.original;
  animState = null;
  placedPieces = original.map(p => ({ ...p }));
  document.getElementById('grid').classList.remove('anim-mode');
  document.getElementById('animBar').classList.remove('active');
  document.querySelectorAll('.cell').forEach(c => c.style.pointerEvents = '');
  document.querySelectorAll('.tool-btn').forEach(b => b.style.pointerEvents = '');
  ['btnSolve','btnSolveMoves','btnSave','btnClear','btnUndo','btnRedo','btnImport','btnExport','btnAI'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = false;
  });
  renderBoard();
}

function updateAnimBar() {
  if (!animState) {
    document.getElementById('animBar').classList.remove('active');
    return;
  }
  document.getElementById('animBar').classList.add('active');
  const icon = animState.paused ? '⏸' : '▶';
  const total = animState.moves.length;
  const current = Math.min(animState.idx, total);
  document.getElementById('animLabel').textContent = icon + ' ' + current + '/' + total;
}

function playNextAnimMove() {
  if (!animState || animState.paused) return;

  if (animState.idx >= animState.moves.length) {
    const redIdx = placedPieces.findIndex(p => p.t === 'r');
    if (redIdx >= 0) {
      const redEl = document.querySelector('#grid .piece[data-idx="' + redIdx + '"]');
      if (redEl) redEl.classList.add('anim-win');
    }
    document.getElementById('animLabel').textContent = '✅ Selesai — ' + animState.moves.length + ' langkah';
    animState.timer = setTimeout(() => stopAnim(), 1600);
    return;
  }

  const [pieceIdx, dx, dy] = animState.moves[animState.idx];
  const piece = placedPieces[pieceIdx];
  if (!piece) { stopAnim(); return; }

  piece.x += dx;
  piece.y += dy;

  const el = document.querySelector('#grid .piece[data-idx="' + pieceIdx + '"]');
  if (el) {
    el.style.left = 'calc(var(--pad) + ' + piece.x + ' * (var(--cell-w) + var(--gap)))';
    el.style.top = 'calc(var(--pad) + ' + piece.y + ' * (var(--cell-h) + var(--gap)))';
    el.classList.add('anim-moving');
    setTimeout(() => { if (el) el.classList.remove('anim-moving'); }, 300);
  }

  animState.idx++;
  updateAnimBar();
  animState.timer = setTimeout(playNextAnimMove, 400);
}

function animateSolveMoves(moves, arr) {
  if (animState) stopAnim();

  const original = placedPieces.map(p => ({ ...p }));
  renderBoard();

  animState = { moves: moves, original: original, idx: 0, paused: false, timer: null };

  document.getElementById('grid').classList.add('anim-mode');
  document.getElementById('animPause').textContent = '⏸ Pause';

  document.querySelectorAll('.cell').forEach(c => c.style.pointerEvents = 'none');
  document.querySelectorAll('.tool-btn').forEach(b => b.style.pointerEvents = 'none');
  ['btnSolve','btnSolveMoves','btnSave','btnClear','btnUndo','btnRedo','btnImport','btnExport','btnAI'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = true;
  });

  updateAnimBar();
  animState.timer = setTimeout(playNextAnimMove, 400);
}

function togglePauseAnim() {
  if (!animState) return;
  if (animState.idx >= animState.moves.length) return;
  animState.paused = !animState.paused;
  const btn = document.getElementById('animPause');
  if (animState.paused) {
    btn.textContent = '▶ Resume';
    clearTimeout(animState.timer);
  } else {
    btn.textContent = '⏸ Pause';
    playNextAnimMove();
  }
  updateAnimBar();
}

// === AI PUZZLE GENERATION ===
const PUZZLE_SYSTEM_PROMPT = `You are a puzzle generator for "Slide Master", a sliding block puzzle on a 4x5 grid.

GRID: 4 columns (x: 0-3), 5 rows (y: 0-4). Total 20 cells.

BLOCKS:
- "r" = red 2x2 (EXACTLY ONE) — win when top-left reaches (1, 3)
- "v" = blue 1x2 (1 wide, 2 tall)
- "h" = green 2x1 (2 wide, 1 tall)
- "y" = yellow 1x1

RULES (MUST ALL BE TRUE):
1. Exactly ONE "r" block
2. "r" NOT already at position (1, 3)
3. Total occupied cells ≤ 18 (at least 2 cells empty)
3.1. TOTAL occupied cells MUST BE EXACTLY 18 — CRITICAL (this overrides rule 3 above)
4. No overlaps, all blocks within bounds
5. Puzzle MUST be solvable — red can reach (1, 3) by sliding blocks
6. Solvable in EXACTLY the move range given in the user prompt (e.g. "30-40 moves" means solution length MUST be between 30 and 40). This overrides any default move count.

OUTPUT FORMAT: Return ONLY a JSON array, no markdown, no explanation:
[["r", 1, 1], ["v", 0, 0], ["h", 2, 4], ["y", 3, 2]]`;

function extractJSON(text) {
  text = String(text || '').trim();
  try { return JSON.parse(text); } catch(_) {}
  const s1 = text.indexOf('['), e1 = text.lastIndexOf(']');
  if (s1 >= 0 && e1 > s1) {
    try { return JSON.parse(text.substring(s1, e1 + 1)); } catch(_) {}
  }
  const s2 = text.indexOf('{'), e2 = text.lastIndexOf('}');
  if (s2 >= 0 && e2 > s2) {
    try {
      const obj = JSON.parse(text.substring(s2, e2 + 1));
      for (const k of ['pieces', 'level', 'puzzle', 'blocks']) {
        if (Array.isArray(obj[k])) return obj[k];
      }
    } catch(_) {}
  }
  throw new Error('Tidak bisa parse JSON dari AI');
}

async function aiGeneratePuzzle(cfg, ctx) {
  const userPrompt = 'Generate a valid solvable puzzle for LEVEL ' + ctx.levelNumber + ' (difficulty: ' + ctx.difficulty + '). Return ONLY the JSON array.';

  if (cfg.provider === 'gemini') {
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(cfg.model) + ':generateContent?key=' + encodeURIComponent(cfg.apiKey);
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: PUZZLE_SYSTEM_PROMPT }] },
        contents: [{ parts: [{ text: userPrompt }] }],
        generationConfig: { temperature: 1.0, responseMimeType: 'application/json', maxOutputTokens: 2048 }
      })
    });
    if (!res.ok) {
      const e = await res.text();
      throw new Error('HTTP ' + res.status + ' — ' + e.substring(0, 100));
    }
    const data = await res.json();
    const text = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || '';
    return extractJSON(text);
  }

  const url = openAIURLFor(cfg.provider, cfg.baseURL);
  if (!url) throw new Error('Base URL kosong');
  const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey };
  if (cfg.provider === 'openrouter') {
    headers['HTTP-Referer'] = location.origin;
    headers['X-Title'] = 'Slide Master Editor';
  }
  const body = {
    model: cfg.model,
    messages: [
      { role: 'system', content: PUZZLE_SYSTEM_PROMPT },
      { role: 'user', content: userPrompt }
    ],
    temperature: 1.0,
    max_tokens: 2048
  };
  if (cfg.provider === 'openai') body.response_format = { type: 'json_object' };
  
  const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
  if (!res.ok) {
    const e = await res.text();
    throw new Error('HTTP ' + res.status + ' — ' + e.substring(0, 100));
  }
  const data = await res.json();
  const text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
  return extractJSON(text);
}

async function aiGenerateWithRetry(cfg, ctx, maxAttempts, onStatus) {
  let lastErr;
  for (let i = 0; i < maxAttempts; i++) {
    try {
      onStatus && onStatus('⏳ Percobaan ' + (i+1) + '/' + maxAttempts + '...');
      const parsed = await aiGeneratePuzzle(cfg, ctx);
      const v = validatePuzzle(parsed, true);
      if (!v.ok) { lastErr = new Error(v.err); continue; }
      const moves = solvePuzzle(parsed);
      if (!moves) {
        if (solvePuzzleTimedOut) {
          return { pieces: parsed, moves: [], unverified: true };
        }
        lastErr = new Error('Puzzle tidak solvable');
        continue;
      }
      if (moves.length === 0) { lastErr = new Error('Merah sudah di target'); continue; }
      if (moves.length < 3) { lastErr = new Error('Terlalu mudah (' + moves.length + ' langkah)'); continue; }
      return { pieces: parsed, moves };
    } catch(e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('Gagal generate');
}

document.getElementById('btnAIGenerate').onclick = async () => {
  const btn = document.getElementById('btnAIGenerate');
  const genStatus = document.getElementById('aiGenStatus');
  const cfg = readAIForm();
  if (!cfg.apiKey) {
    genStatus.textContent = '⚠️ Isi API Key & Save dulu';
    return;
  }
  if (placedPieces.length > 0 && !confirm('Ganti papan saat ini dengan puzzle AI?')) return;
  
  const levelNumber = editIndex >= 0 ? editIndex + 1 : savedLevels.length + 1;
  const ctx = { levelNumber, difficulty: levelDifficulty(levelNumber) };
  btn.disabled = true;
  genStatus.textContent = '⏳ Level ' + levelNumber + ' · ' + ctx.difficulty + '...';
  try {
    const result = await aiGenerateWithRetry(cfg, ctx, 3, (msg) => { genStatus.textContent = msg; });
    placedPieces = result.pieces.map(([t, x, y]) => ({ t, x, y }));
    history = []; redoStack = [];
    editIndex = -1;
    renderBoard();
    // Simpan config terakhir
    aiConfig = cfg;
    saveAIConfigStore();
    const moveInfo = result.unverified ? '⚠ solvability unverified (timeout)' : result.moves.length + ' langkah solusi';
    genStatus.textContent = '✅ ' + result.pieces.length + ' kotak, ' + moveInfo;
    setTimeout(() => { aiModal.style.display = 'none'; }, 600);
    showToast("✅ Puzzle AI siap!", "success");
  } catch(e) {
    genStatus.textContent = '❌ ' + (e.message || 'Gagal').substring(0, 100);
    showToast("Gagal: " + (e.message || 'Error'), "error");
  } finally {
    btn.disabled = false;
  }
};

// === TOAST ===
let toastTimeout;
function showToast(msg, type) {
  type = type || 'info';
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { t.className = ''; }, 2800);
}

// === PWA SW ===
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
  });
}

// === START ===
init();
